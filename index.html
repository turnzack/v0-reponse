<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>v0.reponse - OS Souverain v0.1.0 - idecode-2026</title>
    <script>
      // Firewall réseau global Zero-Error pour mode Web Cloud SaaS
      (function() {
        var isElectron = Boolean(window.electron || window.electronAPI || (navigator.userAgent && navigator.userAgent.indexOf('Electron') !== -1));
        var isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
        var origFetch = window.fetch;
        
        window.fetch = function(input, init) {
          var url = '';
          try {
            if (typeof input === 'string') { url = input; }
            else if (input && input.url) { url = input.url; }
            else if (input && input.href) { url = input.href; }
            else if (input) { url = String(input); }
          } catch(e) {}
          
          if (url) {
            if (url.indexOf('turborepo-summary') !== -1) {
              return Promise.resolve(new Response(JSON.stringify({ hasTurborepo: false }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
            if (url.indexOf('console.neon.tech') !== -1 || url.indexOf('ingest.sentry.io') !== -1) {
              return Promise.resolve(new Response(JSON.stringify({ ok: true }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
            if (url.indexOf('localhost:500') !== -1 || url.indexOf('127.0.0.1:500') !== -1 || url.indexOf(':5006') !== -1) {
              var enableBridge = false;
              try { enableBridge = localStorage.getItem('tiger_enable_local_bridge') === 'true'; } catch(e) {}
              if (!isElectron && !enableBridge) {
                return Promise.resolve(new Response(JSON.stringify({ success: false, cloud_blocked: true }), {
                  status: 200,
                  headers: { 'Content-Type': 'application/json' }
                }));
              }
            }
          }
          return origFetch.apply(this, arguments);
        };
      })();

      document.addEventListener('wheel', function(e) { if (e.ctrlKey) { e.preventDefault(); } }, { passive: false });
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '0' || e.key === '+' || e.code === 'NumpadAdd' || e.code === 'NumpadSubtract')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
